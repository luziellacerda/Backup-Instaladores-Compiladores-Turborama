name: release-theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release-theme:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PC-RETRO-LZ-THEME-PC-NEW.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipName = "PC-RETRO-LZ-THEME-PC-NEW.zip"
          $tempDir = Join-Path $env:RUNNER_TEMP "theme_pack"

          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          if (Test-Path $tempDir) {
            Remove-Item $tempDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $tempDir | Out-Null

          Get-ChildItem -Force | Where-Object {
            $_.Name -ne ".git" -and
            $_.Name -ne ".github" -and
            $_.Name -ne $zipName
          } | ForEach-Object {
            Copy-Item $_.FullName -Destination $tempDir -Recurse -Force
          }

          Compress-Archive -Path (Join-Path $tempDir "*") -DestinationPath $zipName -Force

          if (!(Test-Path $zipName)) {
            throw "Falha ao criar $zipName"
          }

          Write-Host "ZIP criado: $zipName"

      - name: Publish continuous-master release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "continuous-master"
          $zipName = "PC-RETRO-LZ-THEME-PC-NEW.zip"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -f $tag
          git push origin $tag --force

          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Release automática do tema PC-RETRO-LZ-THEME-PC-NEW"
          }

          gh release upload $tag $zipName --clobber
