name: release-theme

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  release-theme:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create PC-RETRO-LZ-THEME-PC-NEW.zip
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $zipName = "PC-RETRO-LZ-THEME-PC-NEW.zip"
          $tempDir = Join-Path $env:RUNNER_TEMP "theme_pack"

          if (Test-Path $zipName) {
            Remove-Item $zipName -Force
          }

          if (Test-Path $tempDir) {
            Remove-Item $tempDir -Recurse -Force
          }

          New-Item -ItemType Directory -Path $tempDir | Out-Null

          $excludeNames = @(
            ".git",
            ".github",
            ".vs",
            ".vscode",
            "venv",
            ".venv",
            "env",
            ".env",
            "__pycache__",
            ".pytest_cache",
            "node_modules",
            "bin",
            "obj",
            $zipName
          )

          $items = Get-ChildItem -Force | Where-Object {
            ($excludeNames -notcontains $_.Name) -and
            (($_.Attributes -band [IO.FileAttributes]::ReparsePoint) -eq 0)
          }

          if ($items.Count -eq 0) {
            throw "Nenhum arquivo de tema encontrado para compactar."
          }

          foreach ($item in $items) {
            Write-Host "Adicionando ao pacote: $($item.Name)"
            Copy-Item -LiteralPath $item.FullName -Destination $tempDir -Recurse -Force -ErrorAction Stop
          }

          Compress-Archive -Path (Join-Path $tempDir "*") -DestinationPath $zipName -Force

          if (!(Test-Path $zipName)) {
            throw "Falha ao criar $zipName"
          }

          Write-Host "ZIP criado: $zipName"

      - name: Publish continuous-master release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"

          $tag = "continuous-master"
          $zipName = "PC-RETRO-LZ-THEME-PC-NEW.zip"

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git tag -f $tag
          git push origin $tag --force

          gh release view $tag
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $tag --notes "Release automática do tema PC-RETRO-LZ-THEME-PC-NEW"
          }

          gh release upload $tag $zipName --clobber
