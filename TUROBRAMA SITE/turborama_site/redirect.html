<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecionando — TurboRama</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <script src="config.js"></script>
  <style>
    body{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .box{max-width:620px;border:1px solid var(--border);border-radius:30px;background:rgba(255,255,255,.06);padding:34px;box-shadow:var(--shadow)}
    .loader{width:64px;height:64px;border:6px solid rgba(255,255,255,.12);border-top-color:var(--green);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 18px}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="box">
    <div class="loader"></div>
    <h1 style="font-size:42px;margin:0 0 12px">Redirecionando...</h1>
    <p class="lead" style="margin:0 auto 22px">Estamos levando você para o canal correto do TurboRama.</p>
    <a id="manual" class="btn btn-primary" href="#">Clique aqui se não abrir</a>
  </div>

  <script src="assets/js/main.js"></script>
  <script>
    const cfg = window.TURBORAMA_CONFIG || {};
    const params = new URLSearchParams(location.search);
    const dest = params.get('dest') || 'whatsapp';
    let url = '#';
    if(dest === 'checkout') url = window.TurboRamaSite.withUtm(cfg.checkoutUrl);
    if(dest === 'demo') url = window.TurboRamaSite.withUtm(cfg.demonstracaoUrl);
    if(dest === 'suporte') url = window.TurboRamaSite.withUtm(cfg.suporteUrl);
    if(dest === 'whatsapp') url = window.TurboRamaSite.whatsappUrl();
    document.getElementById('manual').href = url;
    setTimeout(() => { location.href = url; }, 950);
  </script>
</body>
</html>
