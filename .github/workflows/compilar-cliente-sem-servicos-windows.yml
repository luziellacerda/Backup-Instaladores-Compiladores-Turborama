name: CLIENTE SEM SERVICOS - EmulationStation Windows x64

"on":
  push:
    branches:
      - CLIENTE-SEM-SERVICOS-20260904-1818
    paths:
      - .github/workflows/compilar-cliente-sem-servicos-windows.yml
      - TurboramaEmulationStation/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: emulationstation-windows-x64-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: TurboramaEmulationStation
  WIN32_LIBS_COMMIT: 468eaba48c028921a4bf2abdfa3f3a00ce8d4c0d
  RELEASE_TAG: build-CLIENTE-SEM-SERVICOS-20260904-1818
  PACKAGE_BASENAME: TurboramaEmulationStation-Cliente-Sem-Servicos-Windows-x64
  _CL_: /Zm300

jobs:
  build:
    if: github.ref_name == 'CLIENTE-SEM-SERVICOS-20260904-1818'
    runs-on: windows-2022
    timeout-minutes: 120

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Baixar somente o projeto EmulationStation
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: TurboramaEmulationStation

      - name: Baixar dependencias Windows fixadas
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: batocera-linux/batocera-emulationstation-win32-dependencies
          ref: 468eaba48c028921a4bf2abdfa3f3a00ce8d4c0d
          path: TurboramaEmulationStation/win32-libs
          fetch-depth: 1
          persist-credentials: false

      - name: Validar fontes e dependencias
        run: |
          $ErrorActionPreference = 'Stop'
          $project = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_DIR
          $deps = Join-Path $project 'win32-libs'

          foreach ($required in @(
            (Join-Path $project 'CMakeLists.txt'),
            (Join-Path $project 'embedded-theme\TURBORAMA\theme.xml'),
            (Join-Path $deps 'SDL2\x64\SDL2.dll'),
            (Join-Path $deps 'SDL2_mixer\x64\SDL2_mixer.dll'),
            (Join-Path $deps 'FreeImage\x64\FreeImage.dll'),
            (Join-Path $deps 'curl\x64\bin\libcurl.dll'),
            (Join-Path $deps 'libvlc\x64\libvlc.dll'),
            (Join-Path $deps 'libvlc\x64\libvlccore.dll'),
            (Join-Path $deps 'libvlc\x64\plugins')
          )) {
            if (-not (Test-Path -LiteralPath $required)) {
              throw "Arquivo obrigatorio ausente: $required"
            }
          }

          $actual = (& git -C $deps rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:WIN32_LIBS_COMMIT) {
            throw "Commit inesperado de win32-libs: $actual"
          }

          "Fonte: $env:GITHUB_SHA"
          "Dependencias: $actual"
          cmake --version

      - name: Testar empacotador do tema
        working-directory: TurboramaEmulationStation
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\tests\Test-EmbeddedThemeBuild.ps1
          if ($LASTEXITCODE -ne 0) {
            throw "Teste do tema falhou com codigo $LASTEXITCODE."
          }

      - name: Configurar CMake para Visual Studio 2022 x64
        working-directory: TurboramaEmulationStation
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item Env:CMAKE_TOOLCHAIN_FILE -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_INSTALLATION_ROOT -ErrorAction SilentlyContinue

          cmake -S . -B build-github `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -T "v143,host=x64" `
            -DRETROBAT=OFF `
            -DBATOCERA=OFF `
            -DTURBORAMA_ENABLE_COMMERCIAL_SERVICES=OFF `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=FALSE `
            -DCMAKE_SYSTEM_VERSION=10.0.26100.0
          if ($LASTEXITCODE -ne 0) {
            throw "Configuracao CMake falhou com codigo $LASTEXITCODE."
          }

      - name: Compilar Release x64
        working-directory: TurboramaEmulationStation
        run: |
          $ErrorActionPreference = 'Stop'
          cmake --build build-github `
            --config Release `
            --target emulationstation `
            --parallel 1
          if ($LASTEXITCODE -ne 0) {
            throw "Compilacao falhou com codigo $LASTEXITCODE."
          }

          $exe = '.\bin\x64\Release\emulationstation.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Executavel nao foi gerado em $exe."
          }

      - name: Confirmar que PIX, locadora e controle de tempo nao foram compilados
        working-directory: TurboramaEmulationStation
        run: |
          $ErrorActionPreference = 'Stop'
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" `
            -NoLogo -NoProfile -ExecutionPolicy Bypass `
            -File .\tools\tests\Test-NoCommercialServicesBuild.ps1 `
            -BuildDirectory .\build-github `
            -Executable .\bin\x64\Release\emulationstation.exe
          if ($LASTEXITCODE -ne 0) {
            throw "Validacao do perfil sem servicos falhou com codigo $LASTEXITCODE."
          }

      - name: Montar e validar pacote portatil
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $project = Join-Path $env:GITHUB_WORKSPACE $env:PROJECT_DIR
          $deps = Join-Path $project 'win32-libs'
          $stage = Join-Path $env:RUNNER_TEMP $env:PACKAGE_BASENAME
          $zip = Join-Path $env:RUNNER_TEMP ($env:PACKAGE_BASENAME + '.zip')

          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          if (Test-Path -LiteralPath $zip) {
            Remove-Item -LiteralPath $zip -Force
          }
          New-Item -ItemType Directory -Path $stage | Out-Null

          $runtime = [ordered]@{
            (Join-Path $project 'bin\x64\Release\emulationstation.exe') = 'emulationstation.exe'
            (Join-Path $deps 'FreeImage\x64\FreeImage.dll') = 'FreeImage.dll'
            (Join-Path $deps 'curl\x64\bin\libcurl.dll') = 'libcurl.dll'
            (Join-Path $deps 'libvlc\x64\libvlc.dll') = 'libvlc.dll'
            (Join-Path $deps 'libvlc\x64\libvlccore.dll') = 'libvlccore.dll'
            (Join-Path $deps 'SDL2\x64\SDL2.dll') = 'SDL2.dll'
            (Join-Path $deps 'SDL2_mixer\x64\SDL2_mixer.dll') = 'SDL2_mixer.dll'
            (Join-Path $deps 'SDL2_mixer\x64\optional\libmodplug-1.dll') = 'libmodplug-1.dll'
            (Join-Path $deps 'SDL2_mixer\x64\optional\libogg-0.dll') = 'libogg-0.dll'
            (Join-Path $deps 'SDL2_mixer\x64\optional\libopus-0.dll') = 'libopus-0.dll'
            (Join-Path $deps 'SDL2_mixer\x64\optional\libopusfile-0.dll') = 'libopusfile-0.dll'
          }

          foreach ($item in $runtime.GetEnumerator()) {
            if (-not (Test-Path -LiteralPath $item.Key -PathType Leaf)) {
              throw "Runtime obrigatorio ausente: $($item.Key)"
            }
            Copy-Item -LiteralPath $item.Key `
              -Destination (Join-Path $stage $item.Value) -Force
          }

          Copy-Item -LiteralPath (Join-Path $deps 'libvlc\x64\plugins') `
            -Destination (Join-Path $stage 'plugins') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $project 'resources') `
            -Destination (Join-Path $stage 'resources') -Recurse -Force
          Copy-Item -LiteralPath (Join-Path $project 'bin\x64\Release\screensaver_videos') `
            -Destination (Join-Path $stage 'screensaver_videos') -Recurse -Force

          # Inclui os runtimes MSVC/OpenMP para o ZIP funcionar sem instalador.
          $vswhere = Join-Path ${env:ProgramFiles(x86)} `
            'Microsoft Visual Studio\Installer\vswhere.exe'
          $vsRoot = (& $vswhere -latest -version '[17.0,18.0)' -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath | Select-Object -First 1).Trim()
          if (-not $vsRoot) {
            throw 'Visual Studio 2022 com C++ nao foi localizado no runner.'
          }

          $redistRoot = Join-Path $vsRoot 'VC\Redist\MSVC'
          $redistVersion = Get-ChildItem -LiteralPath $redistRoot -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){2,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1
          if (-not $redistVersion) {
            throw 'Runtime redistribuivel do MSVC nao foi localizado.'
          }

          $crt = Join-Path $redistVersion.FullName 'x64\Microsoft.VC143.CRT'
          $crtFiles = @(Get-ChildItem -LiteralPath $crt -File -Filter '*.dll')
          if ($crtFiles.Count -lt 3) {
            throw "Conjunto CRT incompleto em $crt."
          }
          $crtFiles | Copy-Item -Destination $stage -Force

          $openMp = Join-Path $redistVersion.FullName `
            'x64\Microsoft.VC143.OpenMP\vcomp140.dll'
          if (-not (Test-Path -LiteralPath $openMp -PathType Leaf)) {
            throw "Runtime OpenMP ausente: $openMp"
          }
          Copy-Item -LiteralPath $openMp -Destination $stage -Force

          function Assert-X64PortableExecutable([string]$path) {
            $stream = [IO.File]::OpenRead($path)
            $reader = [IO.BinaryReader]::new($stream)
            try {
              if ($stream.Length -lt 64 -or $reader.ReadUInt16() -ne 0x5A4D) {
                throw "Cabecalho PE invalido: $path"
              }
              $stream.Position = 0x3C
              $peOffset = $reader.ReadInt32()
              if ($peOffset -lt 0 -or $peOffset -gt ($stream.Length - 6)) {
                throw "Offset PE invalido: $path"
              }
              $stream.Position = $peOffset
              if ($reader.ReadUInt32() -ne 0x00004550) {
                throw "Assinatura PE invalida: $path"
              }
              if ($reader.ReadUInt16() -ne 0x8664) {
                throw "Binario nao e x64: $path"
              }
            }
            finally {
              $reader.Dispose()
              $stream.Dispose()
            }
          }

          $portableBinaries = @(Get-ChildItem -LiteralPath $stage -Recurse -File |
            Where-Object { $_.Extension -in '.exe', '.dll' })
          foreach ($binary in $portableBinaries) {
            Assert-X64PortableExecutable $binary.FullName
          }

          $pluginCount = @(Get-ChildItem -LiteralPath (Join-Path $stage 'plugins') `
            -Recurse -File -Filter '*.dll').Count
          if ($pluginCount -lt 100) {
            throw "Pacote VLC incompleto: somente $pluginCount plugins."
          }

          @(
            'TurboRama EmulationStation - Cliente sem servicos - Windows x64 Release'
            'Perfil: sem PIX, pagamentos, creditos, contabilidade, locadora ou controle comercial de tempo'
            "Branch: $env:GITHUB_REF_NAME"
            "Commit da fonte: $env:GITHUB_SHA"
            "Commit de win32-libs: $env:WIN32_LIBS_COMMIT"
            "Runner: $env:ImageOS $env:ImageVersion"
            "Gerado em UTC: $([DateTime]::UtcNow.ToString('yyyy-MM-dd HH:mm:ss'))"
            'Build sem assinatura digital.'
          ) | Set-Content -LiteralPath (Join-Path $stage 'BUILD-INFO.txt') `
            -Encoding utf8NoBOM

          @'
          @echo off
          setlocal
          cd /d "%~dp0"
          if not exist "%~dp0_perfil_teste" mkdir "%~dp0_perfil_teste"
          "%~dp0emulationstation.exe" --home "%~dp0_perfil_teste" --windowed --resolution 1280 720 --debug
          set "exit_code=%ERRORLEVEL%"
          echo.
          echo TurboRama terminou com codigo %exit_code%.
          pause
          exit /b %exit_code%
          '@ | Set-Content -LiteralPath (Join-Path $stage 'TESTAR-ISOLADO.cmd') `
            -Encoding ascii

          function Invoke-SmokeTest([string]$argument) {
            $process = Start-Process `
              -FilePath (Join-Path $stage 'emulationstation.exe') `
              -WorkingDirectory $stage `
              -ArgumentList $argument `
              -PassThru
            if (-not $process.WaitForExit(30000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              throw "Teste $argument excedeu 30 segundos."
            }
            if ($process.ExitCode -ne 0) {
              throw "Teste $argument falhou com codigo $($process.ExitCode)."
            }
          }

          Invoke-SmokeTest '--help'
          Invoke-SmokeTest '--protected-decorations-self-test'
          Invoke-SmokeTest '--no-commercial-services-self-test'

          $manifest = Join-Path $stage 'SHA256SUMS.txt'
          Get-ChildItem -LiteralPath $stage -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $relative = [IO.Path]::GetRelativePath($stage, $_.FullName).Replace('\', '/')
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash *$relative"
            } | Set-Content -LiteralPath $manifest -Encoding ascii

          Compress-Archive -LiteralPath $stage -DestinationPath $zip `
            -CompressionLevel NoCompression
          if (-not (Test-Path -LiteralPath $zip -PathType Leaf)) {
            throw 'ZIP final nao foi criado.'
          }

          $zipHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          $zipHashFile = $zip + '.sha256'
          "$zipHash *$([IO.Path]::GetFileName($zip))" |
            Set-Content -LiteralPath $zipHashFile -Encoding ascii

          "ZIP_PATH=$zip" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "ZIP_HASH_PATH=$zipHashFile" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "ZIP_SHA256=$zipHash" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
          "PACKAGE_FILE_COUNT=$(@(Get-ChildItem -LiteralPath $stage -Recurse -File).Count)" |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8

          "Pacote: $zip"
          "SHA-256: $zipHash"
          "Binarios x64 verificados: $($portableBinaries.Count)"
          "Plugins VLC: $pluginCount"

      - name: Publicar ZIP em um release separado
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = Join-Path $env:RUNNER_TEMP 'release-notes.md'
          @"
          Compilacao automatica Release x64 para cliente sem servicos comerciais.

          - Commit da fonte: $env:GITHUB_SHA
          - Commit de win32-libs: $env:WIN32_LIBS_COMMIT
          - Arquivos no pacote: $env:PACKAGE_FILE_COUNT
          - SHA-256 do ZIP: $env:ZIP_SHA256
          - Runner: Windows Server 2022 / Visual Studio 2022
          - Removidos da compilacao: PIX, pagamentos, creditos, contabilidade,
            locadora, cronometro e controle comercial de tempo

          O executavel nao possui assinatura digital. Use `TESTAR-ISOLADO.cmd`
          para testar sem alterar o perfil normal do EmulationStation.
          "@ | Set-Content -LiteralPath $notes -Encoding utf8NoBOM

          & gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            & gh release upload $env:RELEASE_TAG `
              $env:ZIP_PATH $env:ZIP_HASH_PATH `
              --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) {
              throw 'Falha ao atualizar os arquivos do release.'
            }

            & gh api --method PATCH `
              "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$env:RELEASE_TAG" `
              -f "sha=$env:GITHUB_SHA" -F force=true *> $null
            if ($LASTEXITCODE -ne 0) {
              throw 'Falha ao atualizar o commit da tag do release.'
            }

            & gh release edit $env:RELEASE_TAG `
              --repo $env:GITHUB_REPOSITORY `
              --title "CLIENTE SEM SERVICOS - Windows x64" `
              --notes-file $notes --prerelease
          }
          else {
            & gh release create $env:RELEASE_TAG `
              $env:ZIP_PATH $env:ZIP_HASH_PATH `
              --repo $env:GITHUB_REPOSITORY `
              --target $env:GITHUB_SHA `
              --title "CLIENTE SEM SERVICOS - Windows x64" `
              --notes-file $notes --prerelease
          }
          if ($LASTEXITCODE -ne 0) {
            throw 'Falha ao publicar o release.'
          }

          $releaseUrl = (& gh release view $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY --json url --jq '.url').Trim()
          @(
            '## Compilacao concluida'
            ''
            "- Release: [$env:RELEASE_TAG]($releaseUrl)"
            "- SHA-256: ``$env:ZIP_SHA256``"
            "- Arquivos no pacote: $env:PACKAGE_FILE_COUNT"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8
