name: Build EmulationStation Package

"on":
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout EmulationStation
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC x64
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Remove vcpkg influence
        run: |
          Remove-Item Env:CMAKE_TOOLCHAIN_FILE -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_ROOT -ErrorAction SilentlyContinue
          Remove-Item Env:VCPKG_INSTALLATION_ROOT -ErrorAction SilentlyContinue

      - name: Download original Windows dependencies
        run: |
          git clone --depth 1 https://github.com/batocera-linux/batocera-emulationstation-win32-dependencies.git ../batocera-emulationstation-win32-dependencies

      - name: Clean
        run: |
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item bin -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item package -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item CMakeCache.txt -Force -ErrorAction SilentlyContinue
          Remove-Item EmulationStation-Win64.zip -Force -ErrorAction SilentlyContinue

      - name: Configure
        run: |
          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DRETROBAT=ON `
            -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=FALSE

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Create EmulationStation package for RetroBuild
        run: |
          $out = "package\emulationstation"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $exe = Get-ChildItem -Path . -Recurse -Filter emulationstation.exe |
            Where-Object { $_.FullName -match "\\bin\\x64\\" } |
            Select-Object -First 1

          if (!$exe) {
            Write-Host "ERRO: emulationstation.exe nao encontrado"
            exit 1
          }

          Copy-Item $exe.FullName "$out\emulationstation.exe" -Force

          if (Test-Path "resources") {
            Copy-Item "resources" "$out\resources" -Recurse -Force
          }

          $roots = @(
            "bin\x64",
            "bin\x64\Release",
            "..\batocera-emulationstation-win32-dependencies"
          )

          $files = @(
            "FreeImage.dll",
            "libcurl.dll",
            "libvlc.dll",
            "libvlccore.dll",
            "SDL2.dll",
            "SDL2_mixer.dll",
            "libmodplug-1.dll",
            "libogg-0.dll",
            "libopus-0.dll",
            "libopusfile-0.dll"
          )

          foreach ($file in $files) {
            foreach ($root in $roots) {
              if (Test-Path $root) {
                $found = Get-ChildItem $root -Recurse -File -Filter $file -ErrorAction SilentlyContinue | Select-Object -First 1
                if ($found) {
                  Copy-Item $found.FullName "$out\$file" -Force
                  break
                }
              }
            }
          }

          Get-ChildItem $out -Force

      - name: Zip EmulationStation package
        run: |
          Compress-Archive -Path "package\emulationstation" -DestinationPath "EmulationStation-Win64.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: emulationstation
          path: EmulationStation-Win64.zip

      - name: Publish continuous-master release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous-master
          name: continuous-master
          files: EmulationStation-Win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
